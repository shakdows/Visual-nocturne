<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Visual Nocturne</title>
<meta name="description" content="Cámara nocturna: fotos y video con poca luz, guardados en tu celular.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Visor a pantalla completa; controles en ámbar tenue, como los instrumentos
   de astronomía, para no deslumbrar los ojos adaptados a la oscuridad. */
:root {
  --bg: #000;
  --panel: rgba(12, 8, 6, .62);
  --line: rgba(255, 176, 92, .28);
  --fg: #ffcf9e;
  --dim: #b98a5e;
  --accent: #ff9a3c;
  --rec: #ff3b30;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 var(--font); overflow: hidden; overscroll-behavior: none; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

#view { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
#view.mirror { transform: scaleX(-1); }
#src { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
#flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#flash.on { animation: flash .28s ease-out; }
@keyframes flash { from { opacity: .7 } to { opacity: 0 } }

.bar { position: fixed; left: 0; right: 0; display: flex; align-items: center; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
#top { top: 0; padding-top: calc(env(safe-area-inset-top) + 12px); justify-content: space-between; }
#bottom { bottom: 0; flex-direction: column; gap: 14px; padding-top: 28px; padding-bottom: calc(env(safe-area-inset-bottom) + 18px);
  background: linear-gradient(transparent, rgba(0,0,0,.72) 45%); }

.round { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--panel);
  border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.round[aria-pressed="true"] { background: var(--accent); color: #1a0d00; border-color: var(--accent); }
.round:disabled { opacity: .35; }
.group { display: flex; gap: 10px; }

#status { padding: 7px 13px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line);
  font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-variant-numeric: tabular-nums; white-space: nowrap; }
#status.rec { color: #fff; border-color: var(--rec); }
#status.rec::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--rec); margin-right: 7px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2 } }

#light { display: flex; align-items: center; gap: 12px; width: min(100%, 440px); }
#auto { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 12px; letter-spacing: .08em; }
#auto[aria-pressed="true"] { background: var(--accent); color: #1a0d00; border-color: var(--accent); }
#gain { flex: 1; min-width: 0; height: 32px; accent-color: var(--accent); }
#light label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }

#row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: min(100%, 440px); }
#thumb { width: 52px; height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel) center/cover; justify-self: start; display: grid; place-items: center; color: var(--dim); }
#shutter { width: 78px; height: 78px; border-radius: 50%; border: 4px solid var(--fg); display: grid; place-items: center; }
#shutter i { width: 60px; height: 60px; border-radius: 50%; background: var(--fg); transition: all .18s; }
#shutter:active i { transform: scale(.9); }
#shutter.video i { background: var(--rec); }
#shutter.recording i { width: 28px; height: 28px; border-radius: 7px; background: var(--rec); }
#modes { justify-self: end; display: flex; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); padding: 3px; }
#modes button { padding: 7px 12px; border-radius: 999px; font-size: 13px; color: var(--dim); }
#modes button[aria-pressed="true"] { background: var(--accent); color: #1a0d00; }

#toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 210px); transform: translateX(-50%); max-width: calc(100% - 32px);
  padding: 9px 15px; border-radius: 12px; background: rgba(20, 12, 6, .92); border: 1px solid var(--line); font-size: 13px; text-align: center;
  opacity: 0; transition: opacity .25s; pointer-events: none; }
#toast.on { opacity: 1; }

.sheet { position: fixed; inset: 0; background: #050302; display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top) + 12px) max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 12px) max(16px, env(safe-area-inset-left)); }
.sheet header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; }
.sheet h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .02em; }
#grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; align-content: start; }
#grid button { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #140c06; }
#grid img, #grid video { width: 100%; height: 100%; object-fit: cover; display: block; }
#grid .play { position: absolute; right: 6px; bottom: 6px; width: 20px; height: 20px; fill: #fff; stroke: none; filter: drop-shadow(0 0 3px #000); }
#empty { margin: auto; text-align: center; color: var(--dim); max-width: 30ch; }
#stage { flex: 1; min-height: 0; display: grid; place-items: center; }
#stage img, #stage video { max-width: 100%; max-height: 100%; border-radius: 8px; }
.actions { display: flex; gap: 10px; padding-top: 12px; }
.actions button { flex: 1; padding: 13px 8px; border-radius: 12px; border: 1px solid var(--line); background: #140c06; font-weight: 600; }
.actions .primary { background: var(--accent); color: #1a0d00; border-color: var(--accent); }
.actions .danger { color: #ff8a80; }

#msg { align-items: center; justify-content: center; text-align: center; gap: 16px; }
#msg p { max-width: 34ch; margin: 0; color: var(--fg); }
#msg button { padding: 13px 26px; border-radius: 12px; background: var(--accent); color: #1a0d00; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<video id="src" playsinline muted autoplay></video>
<canvas id="view"></canvas>
<div id="flash"></div>

<div id="top" class="bar">
  <div class="group">
    <button id="torch" class="round" aria-pressed="false" aria-label="Linterna" title="Linterna" disabled>
      <svg viewBox="0 0 24 24"><path d="M13 2 5 14h6l-1 8 8-12h-6z"/></svg></button>
    <button id="green" class="round" aria-pressed="false" aria-label="Visión verde" title="Visión verde">
      <svg viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/></svg></button>
  </div>
  <div id="status" role="status">Iniciando…</div>
  <button id="flip" class="round" aria-label="Cambiar cámara" title="Cambiar cámara">
    <svg viewBox="0 0 24 24"><path d="M4 9a8 8 0 0 1 14-3l2 2M20 15a8 8 0 0 1-14 3l-2-2"/><path d="M20 4v4h-4M4 20v-4h4"/></svg></button>
</div>

<div id="bottom" class="bar">
  <div id="light">
    <button id="auto" aria-pressed="true">AUTO</button>
    <input id="gain" type="range" min="1" max="16" step="0.1" value="1" aria-label="Amplificación de luz">
    <label for="gain">Luz</label>
  </div>
  <div id="row">
    <button id="thumb" aria-label="Abrir galería">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/></svg></button>
    <button id="shutter" aria-label="Tomar foto"><i></i></button>
    <div id="modes">
      <button id="mPhoto" aria-pressed="true">Foto</button>
      <button id="mVideo" aria-pressed="false">Video</button>
    </div>
  </div>
</div>
<div id="toast" role="status"></div>

<section id="gallery" class="sheet" hidden>
  <header><h2>Galería</h2><button id="gClose" class="round" aria-label="Cerrar galería"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
  <div id="grid"></div>
  <p id="empty" hidden>Aún no hay capturas. Las fotos y videos que tomes aparecerán aquí y también se descargan a tu celular.</p>
</section>

<section id="viewer" class="sheet" hidden>
  <header><h2 id="vName"></h2><button id="vClose" class="round" aria-label="Volver"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
  <div id="stage"></div>
  <div class="actions">
    <button id="vSave" class="primary">Guardar</button>
    <button id="vShare">Compartir</button>
    <button id="vDel" class="danger">Borrar</button>
  </div>
</section>

<section id="msg" class="sheet" hidden>
  <p id="msgText"></p>
  <button id="retry">Reintentar</button>
</section>

<script src="app.js"></script>
</body>
</html>
